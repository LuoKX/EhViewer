  image-device:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version-file: .java-version

      - name: Install Android Build SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-37" \
            "build-tools;37.0.0" \
            "ndk;29.0.14206865" \
            "cmake;3.22.1"

      - name: Install Android Rust Targets
        run: rustup target add aarch64-linux-android x86_64-linux-android

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./app/src/main/rust"
          shared-key: ${{ runner.os }}-image-device

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: CMake Cache
        uses: actions/cache@v5
        with:
          path: app/.cxx
          key: cmake-image-device-${{ hashFiles('rust-toolchain.toml', 'settings.gradle.kts', 'app/src/main/cpp/CMakeLists.txt', 'app/src/main/rust/Cargo.lock') }}
          restore-keys: cmake-image-device-

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Rust MVP Device and Native Boundary Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ndk: 29.0.14206865
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: ./gradlew :app:connectedDefaultDebugAndroidTest --no-daemon -Pandroid.injected.build.abi=x86_64

      - name: Android V1 Symbol Check
        run: |
          native_library=app/build/intermediates/stripped_native_libs/defaultDebug/stripDefaultDebugDebugSymbols/out/lib/x86_64/libehviewer.so
          nm -D --defined-only "$native_library" \
            | awk '$2 == "T" && $3 ~ /^Java_com_hippo_ehviewer_/ { print $3 }' \
            | sort -u \
            | grep 'V1$' \
            > app/build/android-v1-symbols.txt
          diff -u \
            app/src/main/rust/crates/ffi/jvm-v1-symbols.txt \
            app/build/android-v1-symbols.txt
          nm -D --defined-only "$native_library" \
            | awk '$2 == "T" && ($3 ~ /^Java_com_hippo_ehviewer_coil_AnimatedWebPDrawableKt_/ || $3 ~ /^Java_com_hippo_ehviewer_image_ImageKt_/) { print $3 }' \
            | sort -u \
            > app/build/android-image-symbols.txt
          diff -u \
            app/src/main/rust/crates/ffi/android-image-symbols.txt \
            app/build/android-image-symbols.txt

  default:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version-file: .java-version

      - name: Install Rust Toolchain
        run: rustup target add armv7-linux-androideabi

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./app/src/main/rust"
          shared-key: ${{ runner.os }}
          save-if: "false"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GradleEncryptionKey }}

      - name: CMake Cache
        uses: actions/cache@v5
        with:
          path: app/.cxx
          key: cmake-default-${{ hashFiles('rust-toolchain.toml', 'settings.gradle.kts', 'app/src/main/cpp/CMakeLists.txt', 'app/src/main/rust/Cargo.lock') }}
          restore-keys: cmake-default-

      - name: Build
        run: ./gradlew assembleDefaultRelease

      - name: Upload ARM64
        uses: actions/upload-artifact@v7
        with:
          name: default-arm64-v8a-${{ github.sha }}
          path: app/build/outputs/apk/default/release/app-default-arm64-v8a-release.apk

      - name: Upload x86_64
        uses: actions/upload-artifact@v7
        with:
          name: default-x86_64-${{ github.sha }}
          path: app/build/outputs/apk/default/release/app-default-x86_64-release.apk

      - name: Upload ARM32
        uses: actions/upload-artifact@v7
        with:
          name: default-armeabi-v7a-${{ github.sha }}
          path: app/build/outputs/apk/default/release/app-default-armeabi-v7a-release.apk

      - name: Upload mapping
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: default-mapping-${{ github.sha }}
          path: app/build/outputs/mapping/defaultRelease/*.txt

      - name: Upload native debug symbols
        uses: actions/upload-artifact@v7
        with:
          name: default-native-debug-symbols-${{ github.sha }}
          path: app/build/outputs/native-debug-symbols/defaultRelease/native-debug-symbols.zip

  marshmallow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version-file: .java-version

      - name: Install Rust Toolchain
        run: rustup target add armv7-linux-androideabi

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./app/src/main/rust"
          shared-key: ${{ runner.os }}
          save-if: "false"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GradleEncryptionKey }}

      - name: CMake Cache
        uses: actions/cache@v5
        with:
          path: app/.cxx
          key: cmake-marshmallow-${{ hashFiles('rust-toolchain.toml', 'settings.gradle.kts', 'app/src/main/cpp/CMakeLists.txt', 'app/src/main/rust/Cargo.lock') }}
