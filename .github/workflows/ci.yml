---
name: CI

'on':
  push:
    branches:
      - '*'
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout v6
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Setup Java
        # actions/setup-java v5
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version-file: .java-version

      - name: Install Clippy Android Target
        run: rustup target add aarch64-linux-android

      - name: Rust Cache
        # Swatinem/rust-cache v2
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: "./app/src/main/rust"
          shared-key: ${{ runner.os }}

      - name: Rewrite Naming Check
        run: |
          python3 -m unittest scripts.tests.test_check_rewrite_names
          python3 scripts/check_rewrite_names.py

      - name: Retired Compatibility Source Check
        run: |
          test ! -e app/src/main/cpp/archive.c
          test ! -e app/src/main/cpp/gifutils.c
          test ! -e app/src/main/cpp/ehviewer.h
          test ! -d app/src/main/cpp/natsort
          test ! -e app/src/main/kotlin/com/hippo/ehviewer/jni/Archive.kt
          test ! -e app/src/main/kotlin/com/hippo/ehviewer/util/RangeSet.kt
          test ! -e app/src/main/kotlin/com/hippo/ehviewer/util/RangeSets.kt
          test ! -e app/src/main/rust/src/parser.rs
          test ! -d app/src/main/rust/src/parser
          if grep -R -n -E \
            'io\.github\.petertrr\.diffutils|nl\.adaptivity\.xmlutil' \
            app/src/main/kotlin core/*/src; then
            echo 'Retired Kotlin diff/XML implementation found'
            exit 1
          fi
          if grep -n -F 'io.github.pdvrieze.xmlutil:' \
            gradle/libs.versions.toml; then
            echo 'Retired XML runtime dependency found'
            exit 1
          fi

      - name: Rustfmt Check
        working-directory: ./app/src/main/rust
        run: cargo fmt --all -- --check

      - name: Android Clippy Check
        working-directory: ./app/src/main/rust
        run: |
          cargo clippy --package ehviewer_rust --target aarch64-linux-android \
            --all-features -- -D warnings

      - name: Rust Core Clippy Check
        working-directory: ./app/src/main/rust
        run: |
          cargo clippy --package eh_archive --package eh_domain --package \
            eh_ffi --package eh_image --package eh_net --all-targets \
            --all-features -- -D warnings

      - name: Rustdoc Check
        working-directory: ./app/src/main/rust
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --workspace --no-deps
          cargo doc --package eh_ffi --features jvm --no-deps
          cargo doc --package ehviewer_rust --features jvm --no-deps

      - name: Rust Workspace Unit Test
        working-directory: ./app/src/main/rust
        run: cargo test --workspace --all-features

      - name: FFI WebP Boundary Test
        working-directory: ./app/src/main/rust
        run: 'cargo test --package eh_ffi --all-features webp::tests::'

      - name: FFI Codec Boundary Test
        working-directory: ./app/src/main/rust
        run: 'cargo test --package eh_ffi --all-features codec::tests::'

      - name: JVM Symbol Check
        working-directory: ./app/src/main/rust
        run: |
          export LC_ALL=C
          cargo build --package ehviewer_rust --features jvm
          nm -g --defined-only target/debug/libehviewer_rust.a \
            | awk '$2 == "T" { print $3 }' \
            | sort -u \
            > target/jvm-defined-symbols.txt
          grep '^Java_com_hippo_ehviewer_' target/jvm-defined-symbols.txt \
            > target/jvm-symbols.txt
          grep 'V1$' target/jvm-symbols.txt > target/jvm-v1-symbols.txt
          diff -u crates/ffi/jvm-v1-symbols.txt target/jvm-v1-symbols.txt
          grep '^Java_com_hippo_ehviewer_jni_HashKt_sha1$' \
            target/jvm-symbols.txt \
            > target/jvm-compat-symbols.txt
          diff -u crates/ffi/jvm-compat-symbols.txt \
            target/jvm-compat-symbols.txt
          grep '^Java_com_hippo_ehviewer_coil_AnimatedWebPDrawableKt_' \
            target/jvm-symbols.txt \
            > target/jvm-webp-symbols.txt
          diff -u crates/ffi/jvm-webp-symbols.txt target/jvm-webp-symbols.txt
          grep '^Java_com_hippo_ehviewer_jni_GifUtilsKt_' \
            target/jvm-symbols.txt \
            > target/jvm-gif-symbols.txt
          grep '^Java_com_hippo_ehviewer_jni_GifUtilsKt_' \
            crates/ffi/android-image-symbols.txt \
            > target/jvm-gif-symbols.expected.txt
          diff -u target/jvm-gif-symbols.expected.txt target/jvm-gif-symbols.txt
          cat \
            crates/ffi/jvm-v1-symbols.txt \
            crates/ffi/jvm-compat-symbols.txt \
            crates/ffi/jvm-webp-symbols.txt \
            target/jvm-gif-symbols.expected.txt \
            | sort -u \
            > target/jvm-symbols.expected.txt
          diff -u target/jvm-symbols.expected.txt target/jvm-symbols.txt
          grep '^JNI_OnLoad$' target/jvm-defined-symbols.txt > \
            target/jvm-loader-symbols.txt
          diff -u crates/ffi/jvm-loader-symbols.txt \
            target/jvm-loader-symbols.txt
          comm -12 \
            crates/ffi/jvm-retired-parser-symbols.txt \
            target/jvm-symbols.txt \
            > target/jvm-retired-parser-symbols-present.txt
          if [[ -s target/jvm-retired-parser-symbols-present.txt ]]; then
            cat target/jvm-retired-parser-symbols-present.txt
            exit 1
          fi

      - name: BBCode Host JNI Smoke Test
        working-directory: ./app/src/main/rust
        run: |
          mkdir -p target/jni-probe
          cc -shared -o target/jni-probe/libehviewer-host.so \
            -Wl,--whole-archive target/debug/libehviewer_rust.a \
            -Wl,--no-whole-archive -ldl -lpthread -lm
          javac -d target/jni-probe \
            ../../../../scripts/fixtures/BBCodeJniSmoke.java
          java --enable-native-access=ALL-UNNAMED -cp target/jni-probe \
            com.hippo.ehviewer.bridge.text.BBCodeBridgeKt \
            target/jni-probe/libehviewer-host.so crates/domain/test_data

      - name: Updater Host JNI Smoke Test
        working-directory: ./app/src/main/rust
        run: |
          javac -d target/jni-probe \
            ../../../../scripts/fixtures/UpdaterJniSmoke.java
          java --enable-native-access=ALL-UNNAMED -cp target/jni-probe \
            com.hippo.ehviewer.bridge.updater.UpdaterBridgeKt \
            target/jni-probe/libehviewer-host.so crates/net/test_data/updater

      - name: ComicInfo Policy Host JNI Smoke Test
        working-directory: ./app/src/main/rust
        run: |
          javac -d target/jni-probe \
            ../../../../scripts/fixtures/ComicInfoPolicyJniSmoke.java
          java --enable-native-access=ALL-UNNAMED -cp target/jni-probe \
            com.hippo.ehviewer.bridge.archive.ComicInfoPolicyBridgeKt \
            target/jni-probe/libehviewer-host.so crates/domain/test_data

      - name: Storage Rules and Recovery Scan Host JNI Smoke Test
        working-directory: ./app/src/main/rust
        run: |
          javac -d target/jni-probe \
            ../../../../scripts/fixtures/StorageRulesJniSmoke.java \
            ../../../../scripts/fixtures/RecoveryScanJniSmoke.java
          java --enable-native-access=ALL-UNNAMED -cp target/jni-probe \
            com.hippo.ehviewer.bridge.files.StorageRulesBridgeKt \
            target/jni-probe/libehviewer-host.so crates/domain/test_data
          java --enable-native-access=ALL-UNNAMED -cp target/jni-probe \
            com.hippo.ehviewer.bridge.download.RecoveryScanBridgeKt \
            target/jni-probe/libehviewer-host.so crates/domain/test_data

      - name: Recovery Directory Host JNI Smoke Test
        working-directory: ./app/src/main/rust
        run: |
          javac -d target/jni-probe \
            ../../../../scripts/fixtures/RecoveryDirectoryJniSmoke.java
          java --enable-native-access=ALL-UNNAMED -cp target/jni-probe \
            com.hippo.ehviewer.bridge.download.RecoveryDirectoryBridgeKt \
            target/jni-probe/libehviewer-host.so crates/domain/test_data

      - name: Backup Import Host JNI Smoke Test
        working-directory: ./app/src/main/rust
        run: |
          javac -d target/jni-probe \
            ../../../../scripts/fixtures/BackupImportJniSmoke.java
          java --enable-native-access=ALL-UNNAMED -cp target/jni-probe \
            com.hippo.ehviewer.bridge.download.BackupImportBridgeKt \
            target/jni-probe/libehviewer-host.so crates/domain/test_data

      - name: Download Metadata Host JNI Smoke Test
        working-directory: ./app/src/main/rust
        run: |
          javac -d target/jni-probe \
            ../../../../scripts/fixtures/DownloadMetadataJniSmoke.java
          java --enable-native-access=ALL-UNNAMED -cp target/jni-probe \
            com.hippo.ehviewer.bridge.download.DownloadMetadataBridgeKt \
            target/jni-probe/libehviewer-host.so crates/domain/test_data

      - name: Preview Tokens Host JNI Smoke Test
        run: bash scripts/test_preview_tokens_jni.sh

      - name: Gallery Navigation Host JNI Smoke Test
        working-directory: ./app/src/main/rust
        run: |
          javac -d target/jni-probe \
            ../../../../scripts/fixtures/GalleryNavigationJniSmoke.java
          java --enable-native-access=ALL-UNNAMED -cp target/jni-probe \
            com.hippo.ehviewer.bridge.gallery.GalleryRequestBridgeKt \
            target/jni-probe/libehviewer-host.so crates/net/test_data

      - name: Install cargo-llvm-cov
        # taiki-e/install-action v2
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad
        with:
          tool: cargo-llvm-cov@0.8.6

      - name: Install LLVM Tools
        run: rustup component add llvm-tools-preview

      - name: FFI Codec Coverage
        working-directory: ./app/src/main/rust
        run: |
          mkdir -p target/llvm-cov
          cargo llvm-cov --package eh_ffi \
            --lib \
            --all-features \
            --ignore-filename-regex "$(printf '%s' \
              '(/recovery_directory(/|\.rs$)|/backup_import(/|' \
              '\.rs$)|/download_metadata(/|\.rs$)|/update_polic' \
              'y(/|\.rs$)|/updater(/|\.rs$)|/recovery_scan(/|\.' \
              'rs$)|/storage_rules(/|\.rs$)|/comic_info_policy(' \
              '/|\.rs$)|/bbcode(/|\.rs$)|/crates/codec_limits/|' \
              '/vendor/|/webp(/|\.rs$)|/production_tar(/|\.rs$)' \
              '|/archive_filters(/|\.rs$)|/production_zip(/|\.r' \
              's$)|/file_rules(/|\.rs$)|/text_spans(/|\.rs$)|/r' \
              'ecovery_batch(/|\.rs$)|/reader_policy(/|\.rs$)|/' \
              'transfer_speed(/|\.rs$)|/recovery_search(/|\.rs$' \
              ')|/spider_info(/|\.rs$)|/local_pages(/|\.rs$)|/c' \
              'ache_keys(/|\.rs$)|/jvm/|/jvm\.rs$|/health\.rs$|' \
              '/webp\.rs$|/lib\.rs$)')" \
            --lcov \
            --output-path target/llvm-cov/eh-ffi-codec.lcov \
            --fail-under-lines 95 \
            --fail-under-functions 95

      - name: Rust Core Health Coverage
        working-directory: ./app/src/main/rust
        run: |
          mkdir -p target/llvm-cov
          cargo llvm-cov --package eh_ffi \
            --lib \
            --all-features \
            --ignore-filename-regex "$(printf '%s' \
              '(/recovery_directory(/|\.rs$)|/backup_import(/|' \
              '\.rs$)|/download_metadata(/|\.rs$)|/update_polic' \
              'y(/|\.rs$)|/updater(/|\.rs$)|/recovery_scan(/|\.' \
              'rs$)|/storage_rules(/|\.rs$)|/comic_info_policy(' \
              '/|\.rs$)|/bbcode(/|\.rs$)|/crates/codec_limits/|' \
              '/vendor/|/webp(/|\.rs$)|/production_tar(/|\.rs$)' \
              '|/archive_filters(/|\.rs$)|/production_zip(/|\.r' \
              's$)|/file_rules(/|\.rs$)|/text_spans(/|\.rs$)|/r' \
              'ecovery_batch(/|\.rs$)|/reader_policy(/|\.rs$)|/' \
              'transfer_speed(/|\.rs$)|/recovery_search(/|\.rs$' \
              ')|/spider_info(/|\.rs$)|/local_pages(/|\.rs$)|/c' \
              'ache_keys(/|\.rs$)|/jvm/|/jvm\.rs$|/codec\.rs$|/' \
              'webp\.rs$|/lib\.rs$)')" \
            --lcov \
            --output-path target/llvm-cov/eh-ffi-health.lcov \
            --fail-under-lines 95 \
            --fail-under-functions 95 \
            -- health::tests::

      - name: P1 Critical Owner Coverage
        run: python3 scripts/check_p1_coverage.py

      - name: P2 Critical Owner Coverage
        run: python3 scripts/check_p2_coverage.py

      - name: P3 Critical Owner Coverage
        run: python3 scripts/check_p3_coverage.py

      - name: P4 Critical Owner Coverage
        run: python3 scripts/check_p4_coverage.py

      - name: Archive Recovery Batch Coverage
        run: |
          python3 - <<'PY'
          from scripts.check_p3_coverage import main
          main((
              ('eh_archive', 'recovery_batch',
               'crates/archive/src/recovery_batch.rs'),
          ), 'p5')
          PY

      - name: Recovery Directory Coverage
        run: |
          python3 - <<'PY'
          from scripts.check_p3_coverage import main
          main((
              ('eh_domain', 'recovery_directory',
               'crates/domain/src/recovery_directory.rs'),
          ), 'p5')
          PY

      - name: Backup Import Owner Coverage
        run: |
          python3 -B - <<'PY'
          from scripts.check_p3_coverage import main
          main((
              ('eh_domain', 'backup_import',
               'crates/domain/src/backup_import.rs'),
          ), 'p5')
          PY

      - name: Download Metadata Coverage
        run: |
          python3 - <<'PY'
          from scripts.check_p3_coverage import main
          main((('eh_domain', 'download_metadata',
                 'crates/domain/src/download_metadata.rs'),), 'p5')
          PY

      - name: Preview Token Policy Coverage
        run: python3 -B scripts/check_preview_token_coverage.py

      - name: Updater Production Owner Coverage
        env:
          CARGO_BUILD_JOBS: 2
        run: python3 scripts/check_updater_coverage.py

      - name: Follow-up Coverage Mask Tests
        run: python3 -m unittest scripts.tests.test_coverage_masks -v

      - name: Domain Coverage
        working-directory: ./app/src/main/rust
        run: |
          mkdir -p target/llvm-cov
          cargo llvm-cov --package eh_domain \
            --all-features \
            --ignore-filename-regex "$(printf '%s' \
              '(/recovery_directory(/|\.rs$)|/backup_import(/|' \
              '\.rs$)|/download_metadata(/|\.rs$)|/update_polic' \
              'y(/|\.rs$)|/updater(/|\.rs$)|/recovery_scan(/|\.' \
              'rs$)|/storage_rules(/|\.rs$)|/comic_info_policy(' \
              '/|\.rs$)|/bbcode(/|\.rs$)|/crates/codec_limits/|' \
              '/vendor/|/webp(/|\.rs$)|/production_tar(/|\.rs$)' \
              '|/archive_filters(/|\.rs$)|/production_zip(/|\.r' \
              's$)|/file_rules(/|\.rs$)|/text_spans(/|\.rs$)|/r' \
              'ecovery_batch(/|\.rs$)|/reader_policy(/|\.rs$)|/' \
              'transfer_speed(/|\.rs$)|/recovery_search(/|\.rs$' \
              ')|/spider_info(/|\.rs$)|/local_pages(/|\.rs$)|/c' \
              'ache_keys(/|\.rs$)|/download/tests\.rs$|/downloa' \
              'd/progress/tests\.rs$|/reader/fetch/tests\.rs$)')" \
            --lcov \
            --output-path target/llvm-cov/eh-domain.lcov \
            --fail-under-lines 95 \
            --fail-under-functions 95

      - name: Gallery Filter Coverage
        working-directory: ./app/src/main/rust
        run: |
          cargo llvm-cov clean --workspace
          mkdir -p target/llvm-cov
          cargo llvm-cov --package eh_domain \
            --lib \
            --ignore-filename-regex "$(printf '%s' \
              '(/recovery_directory(/|\.rs$)|/backup_import(/|' \
              '\.rs$)|/download_metadata(/|\.rs$)|/update_polic' \
              'y(/|\.rs$)|/updater(/|\.rs$)|/recovery_scan(/|\.' \
              'rs$)|/storage_rules(/|\.rs$)|/comic_info_policy(' \
              '/|\.rs$)|/bbcode(/|\.rs$)|/crates/codec_limits/|' \
              '/vendor/|/webp(/|\.rs$)|/production_tar(/|\.rs$)' \
              '|/archive_filters(/|\.rs$)|/production_zip(/|\.r' \
              's$)|/file_rules(/|\.rs$)|/text_spans(/|\.rs$)|/r' \
              'ecovery_batch(/|\.rs$)|/reader_policy(/|\.rs$)|/' \
              'transfer_speed(/|\.rs$)|/recovery_search(/|\.rs$' \
              ')|/spider_info(/|\.rs$)|/local_pages(/|\.rs$)|/c' \
              'ache_keys(/|\.rs$)|/gallery_enrichment(/|\.rs$)|' \
              '/recovery_eh_lookup(/|\.rs$)|/tag_translation(/|' \
              '\.rs$)|/gallery/request(/|\.rs$)|/comic_info\.rs' \
              '$|/contracts\.rs$|/daily\.rs$|/download/|/downlo' \
              'ad\.rs$|/download_catalog\.rs$|/gallery_rules\.r' \
              's$|/library\.rs$|/reader/|/reader\.rs$|/recovery' \
              '\.rs$|/search\.rs$|/session/|/session\.rs$|/sett' \
              'ings\.rs$|/lib\.rs$)')" \
            --lcov \
            --output-path target/llvm-cov/eh-domain-gallery-filter.lcov \
            --fail-under-lines 95 \
            --fail-under-functions 95 \
            -- gallery_filter::tests::

      - name: Gallery Rules Coverage
        working-directory: ./app/src/main/rust
        run: |
          cargo llvm-cov clean --workspace
          mkdir -p target/llvm-cov
          cargo llvm-cov --package eh_domain \
            --lib \
            --ignore-filename-regex "$(printf '%s' \
              '(/recovery_directory(/|\.rs$)|/backup_import(/|' \
              '\.rs$)|/download_metadata(/|\.rs$)|/update_polic' \
              'y(/|\.rs$)|/updater(/|\.rs$)|/recovery_scan(/|\.' \
              'rs$)|/storage_rules(/|\.rs$)|/comic_info_policy(' \
              '/|\.rs$)|/bbcode(/|\.rs$)|/crates/codec_limits/|' \
              '/vendor/|/webp(/|\.rs$)|/production_tar(/|\.rs$)' \
              '|/archive_filters(/|\.rs$)|/production_zip(/|\.r' \
              's$)|/file_rules(/|\.rs$)|/text_spans(/|\.rs$)|/r' \
              'ecovery_batch(/|\.rs$)|/reader_policy(/|\.rs$)|/' \
              'transfer_speed(/|\.rs$)|/recovery_search(/|\.rs$' \
              ')|/spider_info(/|\.rs$)|/local_pages(/|\.rs$)|/c' \
              'ache_keys(/|\.rs$)|/gallery_enrichment(/|\.rs$)|' \
              '/recovery_eh_lookup(/|\.rs$)|/tag_translation(/|' \
              '\.rs$)|/gallery/request(/|\.rs$)|/comic_info\.rs' \
              '$|/contracts\.rs$|/daily\.rs$|/download/|/downlo' \
              'ad\.rs$|/download_catalog\.rs$|/gallery_filter\.' \
              'rs$|/library\.rs$|/reader/|/reader\.rs$|/recover' \
              'y\.rs$|/search\.rs$|/session/|/session\.rs$|/set' \
              'tings\.rs$|/lib\.rs$)')" \
            --lcov \
            --output-path target/llvm-cov/eh-domain-gallery-rules.lcov \
            --fail-under-lines 95 \
            --fail-under-functions 95 \
            -- gallery_rules::tests::

      - name: Download Queue Coverage
        working-directory: ./app/src/main/rust
        run: |
          cargo llvm-cov clean --workspace
          mkdir -p target/llvm-cov
          cargo llvm-cov --package eh_domain \
            --lib \
            --ignore-filename-regex "$(printf '%s' \
              '(/recovery_directory(/|\.rs$)|/backup_import(/|' \
              '\.rs$)|/download_metadata(/|\.rs$)|/update_polic' \
              'y(/|\.rs$)|/updater(/|\.rs$)|/recovery_scan(/|\.' \
              'rs$)|/storage_rules(/|\.rs$)|/comic_info_policy(' \
              '/|\.rs$)|/bbcode(/|\.rs$)|/crates/codec_limits/|' \
              '/vendor/|/webp(/|\.rs$)|/production_tar(/|\.rs$)' \
              '|/archive_filters(/|\.rs$)|/production_zip(/|\.r' \
              's$)|/file_rules(/|\.rs$)|/text_spans(/|\.rs$)|/r' \
              'ecovery_batch(/|\.rs$)|/reader_policy(/|\.rs$)|/' \
              'transfer_speed(/|\.rs$)|/recovery_search(/|\.rs$' \
              ')|/spider_info(/|\.rs$)|/local_pages(/|\.rs$)|/c' \
