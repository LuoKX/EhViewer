              '\.rs$)|/download_metadata(/|\.rs$)|/update_polic' \
              'y(/|\.rs$)|/updater(/|\.rs$)|/recovery_scan(/|\.' \
              'rs$)|/storage_rules(/|\.rs$)|/comic_info_policy(' \
              '/|\.rs$)|/bbcode(/|\.rs$)|/crates/codec_limits/|' \
              '/vendor/|/webp(/|\.rs$)|/production_tar(/|\.rs$)' \
              '|/archive_filters(/|\.rs$)|/production_zip(/|\.r' \
              's$)|/file_rules(/|\.rs$)|/text_spans(/|\.rs$)|/r' \
              'ecovery_batch(/|\.rs$)|/reader_policy(/|\.rs$)|/' \
              'transfer_speed(/|\.rs$)|/recovery_search(/|\.rs$' \
              ')|/spider_info(/|\.rs$)|/local_pages(/|\.rs$)|/c' \
              'ache_keys(/|\.rs$)|/jvm/|/jvm\.rs$|/codec\.rs$|/' \
              'health\.rs$|/lib\.rs$)')" \
            --lcov \
            --output-path target/llvm-cov/eh-ffi-webp.lcov \
            --fail-under-lines 95 \
            --fail-under-functions 95 \
            -- webp::tests::

      - name: Rust Net Aggregate Coverage
        working-directory: ./app/src/main/rust
        run: |
          cargo llvm-cov --package eh_net \
            --all-features \
            --lcov \
            --output-path target/llvm-cov/eh-net.lcov \
            --fail-under-lines 95 \
            --fail-under-functions 95

      - name: Upload Rust Core Coverage
        if: ${{ always() }}
        # actions/upload-artifact v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rust-core-coverage-${{ github.sha }}
          path: app/src/main/rust/target/llvm-cov/*.lcov
          if-no-files-found: warn

      - name: Setup Gradle
        # gradle/actions/setup-gradle v6
        uses: "gradle/actions/setup-gradle@\
          3f5f9adaf7d9fecd50b5935e54106014257a94e6"
        with:
          cache-read-only: true

      - name: Check build-logic
        run: ./gradlew :build-logic:convention:check

      - name: Rust Bridge Unit Test
        run: ./gradlew :app:testDefaultDebugUnitTest

      - name: Compile Android Instrumentation Sources
        run: ./gradlew :app:compileDefaultDebugAndroidTestKotlin

      - name: Spotless Check
        run: ./gradlew spotlessCheck

      - name: Lint Check
        run: ./gradlew lintMarshmallowRelease

  image-device:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        # actions/checkout v6
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Setup Java
        # actions/setup-java v5
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version-file: .java-version

      - name: Install Android Build SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-37" \
            "build-tools;37.0.0" \
            "ndk;29.0.14206865" \
            "cmake;3.22.1"

      - name: Install Android Rust Targets
        run: rustup target add aarch64-linux-android x86_64-linux-android

      - name: Rust Cache
        # Swatinem/rust-cache v2
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: "./app/src/main/rust"
          shared-key: ${{ runner.os }}-image-device

      - name: Setup Gradle
        # gradle/actions/setup-gradle v6
        uses: "gradle/actions/setup-gradle@\
          3f5f9adaf7d9fecd50b5935e54106014257a94e6"
        with:
          cache-read-only: true

      - name: CMake Cache
        # actions/cache v5
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: app/.cxx
          key: "cmake-image-device-${{ hashFiles('rust-toolchain\
            .toml', 'settings.gradle.kts', 'app/src/main/cpp\
            /CMakeLists.txt', 'app/src/main/rust/Cargo.lock'\
            ) }}"
          restore-keys: cmake-image-device-

      - name: Enable KVM
        run: |
          printf '%s%s\n' \
            'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS' \
            '+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Rust MVP Device and Native Boundary Tests
        # reactivecircus/android-emulator-runner v2
        uses: "reactivecircus/android-emulator-runner@\
          a421e43855164a8197daf9d8d40fe71c6996bb0d"
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ndk: 29.0.14206865
          disable-animations: true
          emulator-options: "-no-window -no-audio -no-boot-anim -gpu swiftsha\
            der_indirect"
          script: "./gradlew :app:connectedDefaultDebugAndroidTest \
            --no-daemon -PtargetAbis=x86_64 -Pandroid.inject\
            ed.build.abi=x86_64"

      - name: Android JNI Symbol Check
        run: |
          export LC_ALL=C
          native_library="$(printf '%s' \
              'app/build/intermediates/stripped_native_libs/def' \
              'aultDebug/stripDefaultDebugDebugSymbols/out/lib/' \
              'x86_64/libehviewer.so')"
          unstripped_native_library="$(printf '%s' \
              'app/build/intermediates/merged_native_libs/def' \
              'aultDebug/mergeDefaultDebugNativeLibs/out/lib/' \
              'x86_64/libehviewer.so')"
          nm -D --defined-only "$native_library" \
            | awk '$2 == "T" { print $3 }' \
            | sort -u \
            > app/build/android-dynamic-symbols.txt
          grep '^Java_com_hippo_ehviewer_' \
            app/build/android-dynamic-symbols.txt \
            > app/build/android-java-symbols.txt
          grep 'V1$' app/build/android-java-symbols.txt > \
            app/build/android-v1-symbols.txt
          diff -u \
            app/src/main/rust/crates/ffi/jvm-v1-symbols.txt \
            app/build/android-v1-symbols.txt
          grep \
            "$(printf '%s' \
              '^Java_com_hippo_ehviewer_bridge_archive_ArchiveR' \
              'eaderBridgeKt_.*V2$')" \
            app/build/android-java-symbols.txt \
            > app/build/android-archive-v2-symbols.txt
          diff -u \
            app/src/main/rust/crates/ffi/archive-v2-symbols.txt \
            app/build/android-archive-v2-symbols.txt
          grep \
            "$(printf '%s' \
              '^Java_com_hippo_ehviewer_bridge_archive_ArchiveR' \
              'eaderBridgeKt_.*V3$')" \
            app/build/android-java-symbols.txt \
            > app/build/android-archive-v3-symbols.txt
          diff -u \
            app/src/main/rust/crates/ffi/archive-v3-symbols.txt \
            app/build/android-archive-v3-symbols.txt
          grep '^Java_com_hippo_ehviewer_jni_HashKt_sha1$' \
            app/build/android-java-symbols.txt \
            > app/build/android-compat-symbols.txt
          diff -u \
            app/src/main/rust/crates/ffi/jvm-compat-symbols.txt \
            app/build/android-compat-symbols.txt
          grep -E \
            "$(printf '%s' \
              '^Java_com_hippo_ehviewer_(coil_AnimatedWebPDrawa' \
              'bleKt_|image_ImageKt_|jni_GifUtilsKt_)')" \
            app/build/android-java-symbols.txt \
            > app/build/android-image-symbols.txt
          diff -u \
            app/src/main/rust/crates/ffi/android-image-symbols.txt \
            app/build/android-image-symbols.txt
          cat \
            app/src/main/rust/crates/ffi/jvm-v1-symbols.txt \
            app/src/main/rust/crates/ffi/archive-v2-symbols.txt \
            app/src/main/rust/crates/ffi/archive-v3-symbols.txt \
            app/src/main/rust/crates/ffi/jvm-compat-symbols.txt \
            app/src/main/rust/crates/ffi/android-image-symbols.txt \
            | sort -u \
            > app/build/android-java-symbols.expected.txt
          diff -u \
            app/build/android-java-symbols.expected.txt \
            app/build/android-java-symbols.txt
          grep '^JNI_OnLoad$' app/build/android-dynamic-symbols.txt \
            > app/build/android-loader-symbols.txt
          diff -u \
            app/src/main/rust/crates/ffi/jvm-loader-symbols.txt \
            app/build/android-loader-symbols.txt
          cat \
            app/build/android-java-symbols.expected.txt \
            app/src/main/rust/crates/ffi/jvm-loader-symbols.txt \
            | sort -u \
            > app/build/android-dynamic-symbols.expected.txt
          diff -u \
            app/build/android-dynamic-symbols.expected.txt \
            app/build/android-dynamic-symbols.txt
          comm -12 \
            app/src/main/rust/crates/ffi/android-retired-gif-symbols.txt \
            app/build/android-java-symbols.txt \
            > app/build/android-retired-gif-symbols-present.txt
          if [[ -s app/build/android-retired-gif-symbols-present.txt ]]; then
            cat app/build/android-retired-gif-symbols-present.txt
            exit 1
          fi
          comm -12 \
            app/src/main/rust/crates/ffi/jvm-retired-parser-symbols.txt \
            app/build/android-java-symbols.txt \
            > app/build/android-retired-parser-symbols-present.txt
          if [[ -s app/build/android-retired-parser-symbols-present.txt ]]; then
            cat app/build/android-retired-parser-symbols-present.txt
            exit 1
          fi
          nm --defined-only "$unstripped_native_library" \
            | awk 'NF >= 3 { print $NF }' \
            | sort -u \
            > app/build/android-defined-symbols.txt
          comm -12 \
            app/src/main/rust/crates/ffi/android-retired-native-symbols.txt \
            app/build/android-defined-symbols.txt \
            > app/build/android-retired-native-symbols-present.txt
          if [[ -s app/build/android-retired-native-symbols-present.txt ]]; then
            cat app/build/android-retired-native-symbols-present.txt
            exit 1
          fi

