name: CI

on:
  push:
    branches:
      - '*'
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version-file: .java-version

      - name: Install Clippy Android Target
        run: rustup target add aarch64-linux-android

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./app/src/main/rust"
          shared-key: ${{ runner.os }}

      - name: Rewrite Naming Check
        run: |
          python3 -m unittest scripts.tests.test_check_rewrite_names
          python3 scripts/check_rewrite_names.py

      - name: Rustfmt Check
        working-directory: ./app/src/main/rust
        run: cargo fmt --all -- --check

      - name: Android Clippy Check
        working-directory: ./app/src/main/rust
        run: cargo clippy --package ehviewer_rust --target aarch64-linux-android --all-features -- -D warnings

      - name: Rust Core Clippy Check
        working-directory: ./app/src/main/rust
        run: cargo clippy --package eh_archive --package eh_domain --package eh_ffi --package eh_image --package eh_net --all-targets --all-features -- -D warnings

      - name: Rustdoc Check
        working-directory: ./app/src/main/rust
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --workspace --no-deps
          cargo doc --package eh_ffi --features jvm --no-deps
          cargo doc --package ehviewer_rust --features jvm --no-deps

      # Legacy parser tests still contain live-network smoke cases. They are
      # migrated to offline fixtures slice by slice and must not weaken the
      # deterministic unit-test gate for the new architecture.
      - name: Rust Core Unit Test
        working-directory: ./app/src/main/rust
        run: cargo test --package eh_archive --package eh_domain --package eh_ffi --package eh_image --package eh_net

      - name: Gallery List Compatibility Test
        working-directory: ./app/src/main/rust
        run: 'cargo test --package ehviewer_rust parser::list::tests::'

      - name: Gallery Archive Compatibility Test
        working-directory: ./app/src/main/rust
        run: |
          cargo test --package ehviewer_rust \
            parser::test_parser::tests::test_parse_archive_url
          cargo test --package ehviewer_rust \
            parser::test_parser::tests::test_parse_archives_with_funds

      - name: FFI WebP Boundary Test
        working-directory: ./app/src/main/rust
        run: 'cargo test --package eh_ffi --all-features webp::tests::'

      - name: FFI Codec Boundary Test
        working-directory: ./app/src/main/rust
        run: 'cargo test --package eh_ffi --all-features codec::tests::'

      - name: JVM V1 Symbol Check
        working-directory: ./app/src/main/rust
        run: |
          cargo build --package ehviewer_rust --features jvm
          nm -g --defined-only target/debug/libehviewer_rust.a \
            | awk '$2 == "T" && $3 ~ /^Java_com_hippo_ehviewer_/ { print $3 }' \
            | sort -u \
            | grep 'V1$' \
            > target/jvm-v1-symbols.txt
          diff -u crates/ffi/jvm-v1-symbols.txt target/jvm-v1-symbols.txt
          nm -g --defined-only target/debug/libehviewer_rust.a \
            | awk '$2 == "T" && $3 == "Java_com_hippo_ehviewer_jni_HashKt_sha1" { print $3 }' \
            | sort -u \
            > target/jvm-compat-symbols.txt
          diff -u crates/ffi/jvm-compat-symbols.txt target/jvm-compat-symbols.txt
          nm -g --defined-only target/debug/libehviewer_rust.a \
            | awk '$2 == "T" && $3 ~ /^Java_com_hippo_ehviewer_coil_AnimatedWebPDrawableKt_/ { print $3 }' \
            | sort -u \
            > target/jvm-webp-symbols.txt
          diff -u crates/ffi/jvm-webp-symbols.txt target/jvm-webp-symbols.txt

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.8.6

      - name: Install LLVM Tools
        run: rustup component add llvm-tools-preview

      - name: FFI Codec Coverage
        working-directory: ./app/src/main/rust
        run: |
          mkdir -p target/llvm-cov
          cargo llvm-cov --package eh_ffi \
            --lib \
            --all-features \
            --ignore-filename-regex '(/jvm/|/jvm\.rs$|/health\.rs$|/webp\.rs$|/lib\.rs$)' \
            --lcov \
            --output-path target/llvm-cov/eh-ffi-codec.lcov \
            --fail-under-lines 95 \
            --fail-under-functions 95

      - name: Rust Core Health Coverage
        working-directory: ./app/src/main/rust
        run: |
          mkdir -p target/llvm-cov
          cargo llvm-cov --package eh_ffi \
            --lib \
            --all-features \
            --ignore-filename-regex '(/jvm/|/jvm\.rs$|/codec\.rs$|/webp\.rs$|/lib\.rs$)' \
            --lcov \
            --output-path target/llvm-cov/eh-ffi-health.lcov \
