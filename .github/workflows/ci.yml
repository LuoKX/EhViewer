      - name: Download Progress Coverage
        working-directory: ./app/src/main/rust
        run: |
          mkdir -p target/llvm-cov
          cargo llvm-cov --package eh_domain \
            --lib \
            --ignore-filename-regex "$(printf '%s' \
              '(/recovery_directory(/|\.rs$)|/backup_import(/|' \
              '\.rs$)|/download_metadata(/|\.rs$)|/update_polic' \
              'y(/|\.rs$)|/updater(/|\.rs$)|/recovery_scan(/|\.' \
              'rs$)|/storage_rules(/|\.rs$)|/comic_info_policy(' \
              '/|\.rs$)|/bbcode(/|\.rs$)|/crates/codec_limits/|' \
              '/vendor/|/webp(/|\.rs$)|/production_tar(/|\.rs$)' \
              '|/archive_filters(/|\.rs$)|/production_zip(/|\.r' \
              's$)|/file_rules(/|\.rs$)|/text_spans(/|\.rs$)|/r' \
              'ecovery_batch(/|\.rs$)|/reader_policy(/|\.rs$)|/' \
              'transfer_speed(/|\.rs$)|/recovery_search(/|\.rs$' \
              ')|/spider_info(/|\.rs$)|/local_pages(/|\.rs$)|/c' \
              'ache_keys(/|\.rs$)|/gallery_enrichment(/|\.rs$)|' \
              '/recovery_eh_lookup(/|\.rs$)|/tag_translation(/|' \
              '\.rs$)|/gallery/request(/|\.rs$)|/download/tests' \
              '\.rs$|/download/progress/tests\.rs$|/download\.r' \
              's$|/reader/|/reader\.rs$|/session/|/session\.rs$' \
