            --lcov \
            --output-path target/llvm-cov/eh-domain-download-progress.lcov \
            --fail-under-lines 95 \
            --fail-under-functions 95 \
            -- download::progress::tests::

      - name: Reader Scheduling Coverage
        working-directory: ./app/src/main/rust
        run: |
          mkdir -p target/llvm-cov
          cargo llvm-cov --package eh_domain \
