[package]
name = "ehviewer_rust"
version = "0.0.0"
edition = "2024"

[workspace]
members = ["crates/archive", "crates/domain", "crates/ffi", "crates/image", "crates/net"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/ngnlAYY/EhViewer"

[workspace.lints.rust]
missing_docs = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
unsafe_code = "forbid"
unused_lifetimes = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

[lib]
crate-type = ["staticlib"]

[features]
jvm = ["dep:jni", "dep:jni_fn", "eh_ffi/jvm"]
android = ["jvm", "eh_ffi/android"]
android-26 = ["android", "eh_ffi/android-26"]

[dependencies]
eh_domain = { path = "crates/domain" }
eh_ffi = { path = "crates/ffi" }
eh_net = { path = "crates/net" }
regex-lite = "0.1"
jni = { version = "0.21", optional = true }
jni_fn = { version = "0.1", optional = true }
chrono = { version = "0.4", default-features = false, features = ["std"] }
quick-xml = { default-features = false, version = "0.40" }
tl = { git = "https://github.com/FooIbar/tl.git", features = ["simd"] }
log = "0.4"
android_logger = { default-features = false, version = "0.15" }
serde_cbor = "0.11"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"

[dev-dependencies]
reqwest = "0.13"
tokio = { version = "1", features = ["macros"] }

[profile.release]
panic = "unwind"
strip = true
lto = true
codegen-units = 1
