[package]
name = "ehviewer_rust"
version = "0.0.0"
edition = "2024"

[workspace]
members = ["crates/archive", "crates/domain", "crates/ffi", "crates/image", "crates/net"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/ngnlAYY/EhViewer"

[workspace.lints.rust]
missing_docs = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
unsafe_code = "forbid"
unused_lifetimes = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

[lib]
crate-type = ["staticlib"]

[features]
jvm = ["dep:jni", "eh_ffi/jvm"]
android = ["jvm", "eh_ffi/android"]
android-26 = ["android", "eh_ffi/android-26"]

[dependencies]
eh_ffi = { path = "crates/ffi" }
jni = { version = "0.21", optional = true }
log = "0.4"
android_logger = { default-features = false, version = "0.15" }

[profile.release]
panic = "unwind"
strip = true
lto = true
codegen-units = 1
