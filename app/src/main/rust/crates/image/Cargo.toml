[package]
name = "eh_image"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Host-testable image analysis algorithms for the EhViewer Rust-first core"
publish = false

[dependencies]
anyhow = "1.0"
half = { version = "2.6", default-features = false }
image = { default-features = false, version = "0.25" }
rxing = { version = "0.9", default-features = false, features = ["decoders", "qrcode", "no_character_set_support"] }

[lints]
workspace = true
